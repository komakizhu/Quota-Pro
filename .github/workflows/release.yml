name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag -and -not $env:GITHUB_REF_NAME.StartsWith("$expectedTag-")) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
          }
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Prepare Tauri updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_B64" ]]; then
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY_B64" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/quota-pro-updater.key"
          if base64 --help 2>&1 | grep -q -- '--decode'; then
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          else
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_B64" | base64 -D > "$key_path"
          fi
          chmod 600 "$key_path"
          if ! grep -q '^untrusted comment:' "$key_path"; then
            echo "TAURI_SIGNING_PRIVATE_KEY_B64 does not contain a complete Tauri/minisign private key" >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Build macOS installer DMG with PKG and quarantine helper
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build -- --target universal-apple-darwin
      - name: Package macOS DMG contents
        if: runner.os == 'macOS' && hashFiles('src-tauri/target/universal-apple-darwin/release/bundle/macos/Quota Pro.app/Contents/Info.plist') != ''
        run: |
          chmod +x scripts/build-macos-dmg.sh
          scripts/build-macos-dmg.sh \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/Quota Pro.app" \
            "${GITHUB_REF_NAME#v}" \
            "dist/release"
      - name: Upload macOS installer DMG artifact
        if: runner.os == 'macOS' && hashFiles('dist/release/*.dmg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: quota-pro-macos-installer
          path: dist/release/*.dmg
      - name: Build Windows installers for artifact
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      - name: Upload Windows installer artifacts
        if: runner.os == 'Windows' && (hashFiles('src-tauri/target/release/bundle/msi/*.msi') != '' || hashFiles('src-tauri/target/release/bundle/nsis/*.exe') != '')
        uses: actions/upload-artifact@v4
        with:
          name: quota-pro-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quota Pro ${{ github.ref_name }}
          releaseBody: |
            ## What's new

            - Renames the application to Quota Pro and ships version 1.0.0.
            - Adds manual compact/expanded switching with free positioning and persistent anchors.
            - Adds independent compact/card sizing, edge and corner resize gestures, and double-click reset.
            - Includes free Glass, Soft Light, and Computer skins plus custom skin import.
            - Adds transparent, Dock Glass, and Liquid Glass material modes where supported.
            - Keeps weekly quota visible when the 5-hour window is unavailable, with a clear `W` badge.
            - Improves macOS text rendering, resize stability, localized settings, and automatic update checks.

            ![Quota Pro weekly quota fallback](https://raw.githubusercontent.com/komakizhu/Quota-Pro/main/docs/images/quota-v0.1.4-weekly-fallback.png)

            ## Privacy

            Quota Pro remains local-first: it reads the existing Codex Desktop login state only for quota requests and does not upload prompts, chats, raw quota responses, or local credentials.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
